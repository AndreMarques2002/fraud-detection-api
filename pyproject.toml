[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-api"
version = "0.1.0"
description = "Detecção de fraude em cartões: features sem vazamento, modelo XGBoost, política por custo e API FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.3", "xgboost>=2.0",
    "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5",
]

[project.optional-dependencies]
train = ["matplotlib>=3.8", "pyarrow>=14", "tabulate>=0.9", "requests>=2.31"]
dev = ["pytest>=8.0", "httpx>=0.27", "matplotlib>=3.8", "pyarrow>=14", "tabulate>=0.9", "requests>=2.31"]
demo = ["streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
